spring.application.name=localtix
spring.profiles.default=h2
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/localtix?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
app.jwt.secret=${JWT_SECRET:localtix-development-secret-key-change-this-32chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.qr.secret=${QR_SECRET:localtix-qr-demo-secret-change-me-please}
app.seed=${APP_SEED:false}
